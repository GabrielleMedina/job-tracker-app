{% extends "base.html" %}

{% block title %}Edit Application | Application Tracker {% endblock %}

{% block content %}
<form action="{{ url_for('edit_application', application_id=application.id) }}" method="POST">
<div>

    <div>
        <label for="company_name">Company Name</label>
        <input type="text" id="company" name="company_name" value="{{ application.company_name }}" required>
    </div>
    <div>
        <label for="position">Position</label>
        <input type="text" id="position" name="position" value="{{ application.position }}" required>
    </div>

    <div>
        <label for="date_initiated">Date Initiated</label>
        <input type="date" id="date_initiated" name="date_initiated" value="{{ application.date_initiated }}"required>
    </div>
    <div>
        <label for="date_end">Date End</label>
        <input type="date" id="date_end" name="date_end" value="{% if application.date_end %}{{ application.date_end }}{% endif %}"required>
    </div>
    <div>
        <label for="link">Web Link</label>
        <input type="text" id="link" name="link" value="{{ application.link }}">
    </div>
    <div>
        <input type="radio" id="status-ongoing" name="status" value="ongoing"{% if application.status=="ongoing" %}checked{% endif %} required>
        <label for="status">On Going</label>
        <input type="radio" id="status-interview" name="status" value="interview" {% if application.status=="interview" %}checked{% endif %} required>
        <label for="status">Interview</label>
        <input type="radio" id="status-rejected" name="status" value="rejected" {% if application.status=="rejected" %}checked{% endif %} required>
        <label for="status">Rejected</label>
        <input type="radio" id="status-accepted" name="status" value="accepted" {% if application.status=="accepted" %}checked{% endif %} required>
        <label for="status">Accepted</label>
    </div>

    <div class="meta-actions">
            <a href="{{ url_for('applications') }}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-save">Save Entry</button>
        </div>
</div>
</form>

{% endblock %}
